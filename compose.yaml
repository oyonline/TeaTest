name: tea-exam

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tea_exam}
      MYSQL_USER: ${MYSQL_USER:-tea_exam_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env.production 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.production 中设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-tea_exam_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env.production 中设置 MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-tea_exam}
      SERVER_PORT: 8080
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET:?请在 .env.production 中设置 JWT_SECRET}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?请在 .env.production 中设置 ADMIN_INITIAL_PASSWORD}
      SEED_DEMO_USERS: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
